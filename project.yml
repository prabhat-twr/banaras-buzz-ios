name: BanarasBuzz
options:
  bundleIdPrefix: com.mpt.vnsnews
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.5.0"
    CURRENT_PROJECT_VERSION: "8"
targets:
  BanarasBuzz:
    type: application
    platform: iOS
    sources:
      - path: BanarasBuzz
      - path: Shared
    dependencies:
      - target: BanarasBuzzWidget
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mpt.vnsnews.ios
        INFOPLIST_FILE: BanarasBuzz/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        DEVELOPMENT_TEAM: ""
    info:
      path: BanarasBuzz/Resources/Info.plist
      properties:
        CFBundleDisplayName: Banaras Buzz
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
        # Widgets and panchang notifications open the app at banarasbuzz://panchang.
        CFBundleURLTypes:
          - CFBundleURLName: com.mpt.vnsnews.ios
            CFBundleURLSchemes:
              - banarasbuzz

  # "आज का पंचांग" home-screen and lock-screen widget.
  BanarasBuzzWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: BanarasBuzzWidget
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mpt.vnsnews.ios.widget
        INFOPLIST_FILE: BanarasBuzzWidget/Info.plist
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        DEVELOPMENT_TEAM: ""
    info:
      path: BanarasBuzzWidget/Info.plist
      properties:
        CFBundleDisplayName: Banaras Buzz
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
schemes:
  BanarasBuzz:
    build:
      targets:
        BanarasBuzz: all
        BanarasBuzzWidget: all
    run:
      config: Debug
    archive:
      config: Release
