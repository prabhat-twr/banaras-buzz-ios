name: BanarasBuzz
options:
  bundleIdPrefix: com.mpt.vnsnews
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
targets:
  BanarasBuzz:
    type: application
    platform: iOS
    sources:
      - path: BanarasBuzz
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mpt.vnsnews.ios
        INFOPLIST_FILE: BanarasBuzz/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        DEVELOPMENT_TEAM: ""
    info:
      path: BanarasBuzz/Resources/Info.plist
      properties:
        CFBundleDisplayName: Banaras Buzz
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
schemes:
  BanarasBuzz:
    build:
      targets:
        BanarasBuzz: all
    run:
      config: Debug
    archive:
      config: Release
