name: iOS Build

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: List available Xcode versions
        run: ls /Applications | grep Xcode

      - name: Select latest available Xcode
        run: |
          LATEST_XCODE=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$LATEST_XCODE" ]; then
            LATEST_XCODE="/Applications/Xcode.app"
          fi
          echo "Selecting $LATEST_XCODE"
          sudo xcode-select -s "$LATEST_XCODE"
          xcodebuild -version

      - name: Generate placeholder Secrets.swift
        # The real Secrets.swift (Gemini API key, used by the optional AI chat path) is
        # gitignored and lives only on the developer's own machine, since this repo is public.
        # CI needs *some* file at that path to compile against, so it writes an empty-key stub
        # here — the app just falls back to its offline rule-based assistant in this build.
        run: |
          mkdir -p BanarasBuzz/Config
          cat > BanarasBuzz/Config/Secrets.swift << 'EOF'
          enum Secrets {
              static let geminiAPIKey: String = ""
          }
          EOF

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for iOS Simulator (no signing needed)
        run: |
          xcodebuild \
            -project BanarasBuzz.xcodeproj \
            -scheme BanarasBuzz \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            -configuration Release \
            -derivedDataPath build-sim \
            clean build

      - name: Screenshots in the iPhone simulator
        # Launches the simulator build and captures each screen via banarasbuzz:// links, so the
        # UI can be checked without a Mac. Never fails the build.
        continue-on-error: true
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k in sorted(d, reverse=True) if 'iOS' in k for x in d[k] if x['name'].startswith('iPhone')))")
          echo "Simulator $UDID"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" build-sim/Build/Products/Release-iphonesimulator/BanarasBuzz.app
          xcrun simctl launch "$UDID" com.mpt.vnsnews.ios
          sleep 15
          mkdir -p screenshots
          for r in home news panchang "panchang?date=2026-11-08" year events business explore community more; do
            name=$(echo "$r" | tr '?=' '__')
            xcrun simctl openurl "$UDID" "banarasbuzz://$r"
            sleep 6
            xcrun simctl io "$UDID" screenshot "screenshots/$name.png"
          done
          ls -la screenshots

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: BanarasBuzz-screenshots
          path: screenshots
          if-no-files-found: warn

      - name: Build unsigned device archive
        run: |
          xcodebuild \
            -project BanarasBuzz.xcodeproj \
            -scheme BanarasBuzz \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            -derivedDataPath build-device \
            clean build

      - name: Package unsigned IPA
        run: |
          APP_PATH="build-device/Build/Products/Release-iphoneos/BanarasBuzz.app"
          if [ -d "$APP_PATH" ]; then
            mkdir -p Payload
            cp -r "$APP_PATH" Payload/
            zip -r BanarasBuzz-unsigned.ipa Payload
            echo "Packaged $(du -h BanarasBuzz-unsigned.ipa | cut -f1) IPA"
          else
            echo "No .app product found at $APP_PATH — device build likely failed, see the previous step's log."
            exit 1
          fi

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: BanarasBuzz-unsigned-ipa
          path: BanarasBuzz-unsigned.ipa
          if-no-files-found: warn

      - name: Upload simulator app (for local Simulator testing)
        uses: actions/upload-artifact@v4
        with:
          name: BanarasBuzz-simulator-app
          path: build-sim/Build/Products/Release-iphonesimulator/BanarasBuzz.app
          if-no-files-found: warn
